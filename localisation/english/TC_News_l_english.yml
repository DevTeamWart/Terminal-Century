tcnewsgermany.3.desc: "WIP"
tcnewsgermany.3.a: "God, Germany and Flag."
tcnewsgermany.4.t: "The Greens Wins the 2013 Bundestag Elections!"
tcnewsgermany.4.desc: "WIP"
tcnewsgermany.4.a: "This is Impossible, I swear!"
tcnewsgermany.5.t: "Die Linke Wins the 2013 Bundestag Elections!"
tcnewsgermany.5.desc: "In what many are calling an unexpected anomaly, a Left-wing party has emerged victorious in Germany's 2013 parliamentary elections, for the first time since 1998. Die Linke, and it's 23-year-old candidate, Maximilian Schirmer"
tcnewsgermany.5.a: "The Left Marches Once Again!"
tcnewsgermany.6.t: "Deadlock in German Election - No One Has Won"
tcnewsgermany.6.desc: "WIP."
tcnewsgermany.6.a: "Oh, this is bad!"
