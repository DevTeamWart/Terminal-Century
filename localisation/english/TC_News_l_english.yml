 #GERMAN REPUBLIC
tcnews.1.t: "Germany In Civil War"
tcnews.1.desc: "The German Republic has collapsed into a state of civil war, as government forces are now pitted against several warlords across the country. Several new factions have come out in what many are now calling the collapse of an European behemoth. France has taken the reigns for the Berlinpakt, and has already claimed it will launch a joint Beneluxian-Polish-Austrian intervention towards Germany to stabilize the situation. For now, Europe grapples with what many are calling the worst refugee crisis since the Collapse of Yugoslavia in the late '90s."
tcnews.1.a: "Deustchland Brennt"
