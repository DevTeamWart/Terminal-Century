 #GERMAN REPUBLIC
tcnewsgermany.1.t: "Germany In Civil War"
tcnewsgermany.1.desc: "The German Republic has collapsed into a state of civil war, as government forces are now pitted against several warlords across the country. Several new factions have come out in what many are now calling the collapse of an European behemoth. France has taken the reigns for the Berlinpakt, and has already claimed it will launch a joint Beneluxian-Polish-Austrian intervention towards Germany to stabilize the situation. For now, Europe grapples with what many are calling the worst refugee crisis since the Collapse of Yugoslavia in the late '90s."
tcnewsgermany.1.a: "Deustchland Brennt"
tcnewsgermany.2.t: "AfD Wins the 2013 Elections!"
tcnewsgermany.2.desc: "WIP"
tcnewsgermany.2.a: "Four More Years!"
tcnewsgermany.3.t: "CDU Wins the 2013 Elections!"
tcnewsgermany.3.desc: "WIP"
tcnewsgermany.3.a: "God, Germany and Flag."
tcnewsgermany.4.t: "The Greens Wins the 2013 Bundestag Elections!"
tcnewsgermany.4.desc: "WIP"
tcnewsgermany.4.a: "This is Impossible, I swear!"
tcnewsgermany.5.t: "Die Linke Wins the 2013 Bundestag Elections!"
tcnewsgermany.5.desc: "In what many are calling an unexpected anomaly, a Left-wing party has emerged victorious in Germany's 2013 parliamentary elections, for the first time since 1998. Die Linke, and it's 23-year-old candidate, Maximilian Schirmer"
tcnewsgermany.5.a: "The Left Marches Once Again!"
tcnewsgermany.6.t: "Deadlock in German Election - No One Has Won"
tcnewsgermany.6.desc: "WIP."
tcnewsgermany.6.a: "Oh, this is bad!"
tcnewsgermany.7.t: "Day X"
tcnewsgermany.7.desc: "The worst has officialy come to pass - Bjorn Hocke's faction, the Nu-Wehrmacht, has overthrown the 'Jewish occupation' of Germany under the AfD, thus resurrecting the "
tcnewsgermany.7.a: "Heil Mein Führer"
tcnewsgermany.10.t: "Coalition Invasion of Bosnia"
tcnewsgermany.10.desc: "WIP"
tcnewsgermany.10.a: "Germans - Go Forward and Defend Freedom!"

 #MIDDLE EAST
tcnewsmideast.TBA.t: "Great Middle Eastern War begins"
tcnewsmideast.TBA.desc: "PLACEHOLDER - Tensions between Israel, Saudi Arabia, Iran, Iraq and Turkey skyrocket into an open conflict. Both sides gear up for war as all are nuclear-armed nations. Egypt and Greece hit by refugee crisis. Oil prices skyrocket."
tcnewsmideast.TBA.a: ""
tcnewsmideast.TBA.t: "Persian Victory!"
tcnewsmideast.TBA.desc: "PLACEHOLDER - Iran has fully won against the other sides and has proclaimed a total victory over the Little Satan. Khamenei makes big speech in Tehran. Saudi royal family executed."
tcnewsmideast.TBA.a: ""
tcnewsmideast.TBA.t: "Saudi Victory!"
tcnewsmideast.TBA.desc: "PLACEHOLDER - Saudi Arabia has fully won against the other sides and has proclaimed a total victory over the Zionist Experiment and the False Islamic Revolution. Kingdom of Arabia proclaimed. Very pro CPS and anti Berlinpakt."
tcnewsmideast.TBA.a: ""
tcnewsmideast.TBA.t: "Iraqi Victory!"
tcnewsmideast.TBA.desc: "PLACEHOLDER - Iraq has fully won against the other sides and has proclaimed a total victory over the other sides. Military parade in Saddam City/Baghdad. Saddam proclaims UAR and nationalizes oil reserves."
tcnewsmideast.TBA.a: ""
tcnewsmideast.TBA.t: "Israeli Victory!"
tcnewsmideast.TBA.desc: "PLACEHOLDER - Israel has fully won against the other sides and has proclaimed a total victory over the terrorists. Very pro-Berlinpakt and has condemned the CPS for not intervening on their side. MidEast collapses into anarchy. Jordan and Golan Heights annexed."
