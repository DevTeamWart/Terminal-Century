 #MIDDLE EAST
tcnewsmideast.TBA.t: "Great Middle Eastern War begins"
tcnewsmideast.TBA.desc: "Tensions Between Israel, Saudi Arabia, Iran, Iraq and Turkey have been skyrocketing to the point of an open conflict as war plagues the Middle East yet again, the region once again filled with uncertainty and with high expectations from the world, we can only sit and watch. Both Sides gear up for war as all are Nuclear-Armed Nations, as a Nuclear Conflict is likely. Egypt and Greece have been hit by a refugee crisis at the start of the conflict, as people flee from the battlegrounds and from missile-strikes on their homelands and cities, it is uncertain to know if Egypt and Greece will start banning refugees. Oil Prices skyrocket at an all time high as Saudi Arabian and Iranian Oil Fields are put to work for war and hit by missiles, a Fuel and Oil shortage hits Europe and parts of Africa. For the world is sure to be devastated."
tcnewsmideast.TBA.a: "It was expected."
tcnewsmideast.TBA.t: "Persian Victory!"
tcnewsmideast.TBA.desc: "Iranian Tanks and Forces clean up the last of their enemies, as Iran has fully won and proclaimed a total victory over the Little Satan, every other side has been fully decimated by Iranian Missiles, Forces and Tanks. Khamenei adressed the Nation with a victory speech in Tehran, as the Oil can start flowing once more. The entire Saudi Royal Family has been also executed as a result of the Iranian Victory, and the Middle East is now either under direct Persian Rule or under the Persian Thumb. It is unknown what will ensue in the Middle East now, but for now, Iran is the uncontested victor of the Middle East."
tcnewsmideast.TBA.a: "The Ayatollah's Revenge"
tcnewsmideast.TBA.t: "Saudi Victory!"
tcnewsmideast.TBA.desc: "Saudi Arabian Forces destroy the last remnants of the Zionists and Persians, as they have proclaimed a total victory over the Zionist Experiment and the False Islamic Revolution, as the Oil can flow once more from Arabia. Arabian Flags fly in Tehran and Jerusalem. Amidst the end of the war, the Kingdom of Arabia has been proclaimed, becoming the undisputed leader of the Middle East, and being very Pro-CPS and Anti-Berlinpakt. It is not yet known what Arabian plans are, but for now, peace is settled in the Middle East."
tcnewsmideast.TBA.a: "They basically owned the place anyway."
tcnewsmideast.TBA.t: "Iraqi Victory!"
tcnewsmideast.TBA.desc: "Iraqi Forces have officially ended all operations, as Baghdad proclaims a total victory over the other sides. A large Military parade ensued in Baghdad / Saddam City, as a Victory Speech was given out at the end of the Military Parade. After the dust has settled, Saddam has officialy proclaimed the UAR, and has already ordered the nationalization of oil reserves, to profit as best they can and ramp up nationalism. It is unknown whether they plan to re-export oil, or what they will do next with the Middle East, but for now, peace under Saddam's thumb has been restored to the Middle East."
tcnewsmideast.TBA.a: "This guy won, you mean to tell me?"
tcnewsmideast.TBA.t: "Israeli Victory!"
tcnewsmideast.TBA.desc: "Israel has proclaimed a total victory over the terrorists, as the last of Israeli Forces destroy remaining 'terrorist' factions. Being very Pro-Berlinpakt, Jerusalem has also condemned the CPS for not intervening on their side to help them. Jordan and the Golan Heights are now annexed into Israel. It is unknown what the plan is next. In the amidst of the Israeli Victory, peace has may settled on paper, but the Middle East has collapsed into anarchy, with multiple warlords fighting over territory, and Oil Fields have been totally destroyed after rampant war and post-war Anarchism. One thing is for sure, the Middle East has been plagued by decades more endless war between warlords."
tcnewsmideast.TBA.a: "It makes sense."
